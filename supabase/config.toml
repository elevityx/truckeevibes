# Local stack for TruckeeVibes. Own port range (554xx) so it never collides with other local stacks.
project_id = "truckeevibes"

[api]
enabled = true
port = 55421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 2000

[db]
port = 55422
shadow_port = 55420
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 55429

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55424

[analytics]
enabled = true
port = 55427
backend = "postgres"

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "env(SUPABASE_AUTH_SITE_URL)"
additional_redirect_urls = ["env(SUPABASE_AUTH_SITE_URL)"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 12

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Edge Functions arrive in M1; these two are called by schedulers and carry their own HMAC / secret checks.
[functions.ingest]
verify_jwt = false

[functions.weekly-email]
verify_jwt = false
