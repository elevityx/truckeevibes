<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sample Event Details</title></head>
<body>
  <div itemscope itemtype="http://schema.org/Event">
    <h1 itemprop="name">Sample Chamber Event</h1>
    <div itemprop="location" itemscope itemtype="http://schema.org/Place">
      <span itemprop="name">Example Gallery</span>
      <div itemprop="address" itemscope itemtype="http://schema.org/PostalAddress">
        <meta itemprop="streetAddress" content="10 Sample Lane">
        <meta itemprop="addressLocality" content="TRUCKEE">
        <meta itemprop="addressRegion" content="California">
        <meta itemprop="postalCode" content="96161">
      </div>
    </div>
  </div>
</body></html>
