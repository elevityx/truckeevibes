name: Lights mirror
on: { schedule: [{ cron: '*/15 * * * *' }], workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: lights-mirror, cancel-in-progress: false }
jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run mirror
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_HMAC_KEY: ${{ secrets.INGEST_HMAC_KEY }}
          LIGHTS_REST_URL: ${{ vars.LIGHTS_REST_URL }}
          LIGHTS_PUBLISHABLE_KEY: ${{ vars.LIGHTS_PUBLISHABLE_KEY }}
