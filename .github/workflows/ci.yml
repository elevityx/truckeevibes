name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # build before test: the AC-M0-01/11 tests read the static export in out/
      # no env: the snapshot is empty and client pages prerender without a database
      - run: npm run build
      - run: npm test
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: npm run test:functions
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:repo

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_SITE_URL: http://localhost:3000
      # Cloudflare's public always-pass TEST secret: local/CI only, never a real secret
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - name: Start local stack
        run: npm run db:start -- -x studio,imgproxy,logflare,vector,supabase_pooler,realtime,postgres-meta,inbucket
      - run: npm run db:reset
      - run: npm run db:test
      # the concurrency harness talks to the running stack: hand it the URL the CLI reports (bare, quotes stripped)
      - name: Export the local DB URL
        run: supabase status -o env | grep '^DB_URL=' | tr -d '"' >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: test -n "$DB_URL"
      - run: npm run db:test:concurrency

  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Commit identity and diff hygiene
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$BASE" in ''|0000000000000000000000000000000000000000) echo "no base for $EVENT"; exit 1;; esac
          node scripts/secret-scan.mjs --no-files --range "$BASE..$HEAD_SHA"
          git diff --check "$BASE" "$HEAD_SHA"
